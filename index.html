<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172638">
  <title>Hyrule: Plateau Quest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game" aria-label="Plateau Quest game">
    <canvas id="scene" aria-label="Game world"></canvas>
    <div class="hud"><div id="hearts" aria-label="Health"></div><span id="region">GREAT PLATEAU · FIELD TRIAL</span><button id="save" type="button">SAVE</button></div>
    <div id="message" role="status">Find the old gate beyond the ruins.</div>
    <div class="controls" aria-label="Touch controls">
      <div class="move"><button data-control="left" aria-label="Move left">◀</button><button data-control="right" aria-label="Move right">▶</button></div>
      <div class="actions"><button data-control="attack" aria-label="Sword attack">⚔</button><button data-control="jump" aria-label="Jump">▲</button></div>
    </div>
    <div id="overlay" hidden><div class="panel"><h1>PLATEAU QUEST</h1><p id="overlayText"></p><button id="resume">CONTINUE</button><button id="restart">NEW GAME</button></div></div>
    <button id="pause" aria-label="Pause game">Ⅱ</button>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
